name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a release

jobs:
  build:
    # Windows, because MonoGame's shader compiler needs it.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 10 builds the app; 6 runs the MonoGame 3.8.1 content builder
          dotnet-version: |
            6.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the .NET Android workload
        run: dotnet workload install android

      - name: Install the MonoGame content builder
        run: dotnet tool install --global dotnet-mgcb --version 3.8.1.303

      - name: Compile models and shaders for Android
        shell: pwsh
        run: |
          # Same content list as desktop, but plain (uncompressed) textures for the widest GPU support.
          (Get-Content Content/Content.mgcb -Raw) -replace 'TextureFormat=Compressed', 'TextureFormat=Color' |
            Set-Content Content/Content.Android.mgcb
          Push-Location Content
          mgcb /@:Content.Android.mgcb /platform:Android /outputDir:../Android/ContentBuilt /intermediateDir:../Android/obj/content /workingDir:.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Get-ChildItem Android/ContentBuilt -Recurse -Filter *.xnb | Measure-Object | ForEach-Object { "Compiled $($_.Count) content files" }

      - name: Bundle the official campaign (playable offline)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force Android/Bundled | Out-Null
          Invoke-WebRequest "https://github.com/RighteousRyan1/tanks_rebirth_motds/raw/master/Vanilla.campaign" -OutFile Android/Bundled/Vanilla.campaign

      - name: Build the APK
        run: dotnet publish Android/TanksRebirth.Android.csproj -c Release -f net10.0-android

      - name: Collect the APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $apk = Get-ChildItem Android/bin/Release -Recurse -Filter *-Signed.apk | Select-Object -First 1
          if (-not $apk) { throw "No signed APK was produced." }
          Copy-Item $apk.FullName out/TanksRebirth.apk
          "APK size: {0:N1} MB" -f ($apk.Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: TanksRebirth-android
          path: out/TanksRebirth.apk
          if-no-files-found: error

      - name: Publish as the "latest" release (direct APK download link)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest out/TanksRebirth.apk --title "Latest Android build" --notes "Built from $env:GITHUB_SHA. Tap TanksRebirth.apk below to download it on your phone." --latest

  # Runs the APK on an Android emulator and publishes screenshots + logs as the "emulator-test" release,
  # so startup problems can be diagnosed without a phone.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TanksRebirth-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash Android/ci/emulator-test.sh

      - name: Publish diagnostics as the "emulator-test" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete emulator-test --yes --cleanup-tag || true
          gh release create emulator-test diag/* --title "Emulator test results" --notes "Screenshots and logs from running $GITHUB_SHA on an emulator." --prerelease
